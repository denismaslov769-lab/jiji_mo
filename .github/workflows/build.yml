name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "IP/домен игрового сервера для лаунчера"
        required: false
        default: ""

permissions:
  contents: write

env:
  SAMP_CEF_REPO: ZOTTCE/samp-cef
  SAMP_CEF_SHA: f14fe4fa7f0d036edf445ba02b4bddd4cccac377
  PAWN_VERSION: v3.10.10
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- мод
  gamemode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pawn compiler
        id: pawn-cache
        uses: actions/cache@v4
        with:
          path: ~/pawncc
          key: pawncc-${{ env.PAWN_VERSION }}-linux64

      - name: Build Pawn compiler
        if: steps.pawn-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PAWN_VERSION" https://github.com/pawn-lang/compiler.git /tmp/pawn
          cmake -S /tmp/pawn/source/compiler -B /tmp/pawn/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/pawn/build --target pawncc -j2
          mkdir -p ~/pawncc
          cp /tmp/pawn/build/pawncc /tmp/pawn/build/libpawnc.so ~/pawncc/

      - name: Compile godjo.amx
        run: |
          export LD_LIBRARY_PATH=~/pawncc PAWNCC=~/pawncc/pawncc
          bash tools/build-gamemode.sh "$GITHUB_WORKSPACE/out/godjo.amx" 2>&1 | iconv -f CP1251 -t UTF-8 | tee build.log
          test -f out/godjo.amx
          if grep -q " error " build.log; then exit 1; fi

      - name: Compile godjo_bots.amx (filterscript, FCNPC)
        run: |
          export LD_LIBRARY_PATH=~/pawncc PAWNCC=~/pawncc/pawncc
          bash tools/build-filterscript.sh godjo_bots "$GITHUB_WORKSPACE/out/godjo_bots.amx" 2>&1 | iconv -f CP1251 -t UTF-8 | tee fs.log
          test -f out/godjo_bots.amx
          if grep -q " error " fs.log; then exit 1; fi

      - name: Smoke test (Linux SA-MP server + CEF stub)
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib libc6:i386 libstdc++6:i386 > /dev/null
          bash tools/ci/smoke-test.sh "$GITHUB_WORKSPACE/out/godjo.amx"

      - uses: actions/upload-artifact@v4
        with:
          name: gamemode
          path: out/*.amx

  # ---------------------------------------------------------------- samp-cef (клиент + серверный плагин)
  cef:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: samp-cef
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SAMP_CEF_REPO }}
          ref: ${{ env.SAMP_CEF_SHA }}
          path: samp-cef

      - name: Configuration
        shell: pwsh
        run: |
          Write-Output "DX_SDK_DIR=${env:TEMP}/dxsdk" >> ${env:GITHUB_ENV}
          Write-Output "DX_SDK=${env:TEMP}/dxsdk/Lib/x86" >> ${env:GITHUB_ENV}
          Write-Output "CEF_PATH=${env:TEMP}/cef" >> ${env:GITHUB_ENV}

      - name: DirectX SDK cache
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DX_SDK_DIR }}
          key: directx

      - name: CEF distribution cache
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-windows32-${{ hashFiles('samp-cef/cef-distribution.json') }}

      - name: Install DirectX SDK
        if: steps.dx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o _DX2010_.exe
          7z x _DX2010_.exe DXSDK/Lib/x86 -o_DX2010_
          mv _DX2010_/DXSDK $DX_SDK_DIR
          rm -fR _DX*_ _DX*_.exe

      - name: Download CEF distribution
        if: steps.cef-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node scripts/download-cef.mjs --output "$CEF_PATH"

      - name: Install Rust (i686 MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            samp-cef/target
          key: cargo-win-i686-${{ env.SAMP_CEF_SHA }}

      - name: Build samp-cef
        shell: bash
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Package client
        shell: bash
        run: |
          node scripts/package-client.mjs --cef "$CEF_PATH" --output redist
          mkdir -p ../cefout/client ../cefout/server
          cp -r redist/. ../cefout/client/
          cp target/i686-pc-windows-msvc/release/cef_server.dll ../cefout/server/cef.dll

      - uses: actions/upload-artifact@v4
        with:
          name: cef
          path: cefout

  # ---------------------------------------------------------------- лаунчер
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish GodjoLauncher.exe
        shell: bash
        run: |
          tr -d "\r\n" < launcher/app.ico.b64 | base64 -d > launcher/app.ico
          dotnet publish launcher/GodjoLauncher.csproj -c Release -r win-x86 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None -p:Version=2.0.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/GodjoLauncher.exe

  # ---------------------------------------------------------------- сборка пакетов и релиз
  package:
    runs-on: ubuntu-latest
    needs: [ gamemode, cef, launcher ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Server package
        run: |
          S=dist/GodjoRP-Server
          mkdir -p $S/gamemodes $S/plugins $S/scriptfiles/godjo/migrations $S/filterscripts
          cat vendor/samp-server/samp-server.exe.b64.* | tr -d "\r\n" | base64 -d > $S/samp-server.exe
          (cd $S && echo "$(cat ../../vendor/samp-server/samp-server.exe.sha256)  samp-server.exe" | sha256sum -c -)
          cp art/gamemode/godjo.amx $S/gamemodes/
          cp art/cef/server/cef.dll $S/plugins/
          # NPC-боты: плагин FCNPC (0.3.7 R2) + filterscript godjo_bots. Если плагин не скачался — сервер работает без ботов.
          cp art/gamemode/godjo_bots.amx $S/filterscripts/ || true
          mkdir -p fcnpc && (curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/ziggi/FCNPC/releases/tags/v2.0.11 | jq -r '.assets[].browser_download_url' > fcnpc/urls.txt || true)
          cat fcnpc/urls.txt || true
          for u in $(grep -iE '\.(zip|dll)$' fcnpc/urls.txt | grep -viE 'linux|\.so|-DL' ); do (cd fcnpc && curl -fsSL -O "$u") || true; done
          (cd fcnpc && for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d x; done) || true
          F=$(find fcnpc -iname 'FCNPC.dll' | head -1)
          if [ -n "$F" ]; then cp "$F" $S/plugins/FCNPC.dll; echo "FCNPC: $F"; else echo "::warning::FCNPC.dll не найден — боты будут отключены"; sed -i 's/^plugins cef.dll FCNPC.dll/plugins cef.dll/; s/^filterscripts godjo_bots/filterscripts/' server/server.cfg; fi
          N=$(find fcnpc -type d -iname 'FCNPC' -path '*scriptfiles*' | head -1); if [ -n "$N" ]; then mkdir -p $S/scriptfiles && cp -r "$N" $S/scriptfiles/; fi
          for f in schema seed; do iconv -f UTF-8 -t CP1251 database/$f.sql > $S/scriptfiles/godjo/$f.sql; done
          if ls database/migrations/*.sql >/dev/null 2>&1; then for f in database/migrations/*.sql; do iconv -f UTF-8 -t CP1251 "$f" > $S/scriptfiles/godjo/migrations/$(basename "$f"); done; fi
          iconv -f UTF-8 -t CP1251 server/server.cfg | sed 's/$/\r/' > $S/server.cfg
          for b in start.bat open-ports.bat; do sed "s/\r*$/\r/" server/$b > $S/$b; done
          cp docs/SERVER.md $S/README-SERVER.md
          (cd dist && zip -qr GodjoRP-Server.zip GodjoRP-Server)

      - name: Client packages
        run: |
          mkdir -p pk/cef pk/ui/cef/assets/godjo pk/asi
          cp -r art/cef/client/. pk/cef/
          (cd pk/cef && zip -qr ../../dist/cef-client.zip .)
          cp -r cef/godjo/. pk/ui/cef/assets/godjo/
          (cd pk/ui && zip -qr ../../dist/godjo-ui.zip .)
          curl -fsSL -o asi.zip https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/latest/download/Ultimate-ASI-Loader.zip
          unzip -o -q asi.zip -d asi_src
          find asi_src -iname 'dinput8.dll' -exec cp {} pk/asi/dinput8.dll \;
          test -f pk/asi/dinput8.dll
          (cd pk/asi && zip -qr ../../dist/asi-loader.zip .)

      - name: Build packages (Modloader, cars, textures)
        run: |
          # Modloader — подключает моды без замены файлов игры
          curl -fsSL -o ml.zip https://github.com/thelink2012/modloader/releases/download/v0.3.10/modloader.zip
          mkdir -p pk/ml && unzip -o -q ml.zip -d pk/ml && rm -f pk/ml/Readme.txt pk/ml/Leia-me.txt
          test -f pk/ml/modloader.asi
          (cd pk/ml && zip -qr ../../dist/modloader.zip .)
          # автопак: vendor/cars/*.b64.* -> 7z -> zip
          cat vendor/cars/godjo-cars.7z.b64.* | tr -d "\r\n" | base64 -d > cars.7z
          echo "$(cat vendor/cars/godjo-cars.7z.sha256)  cars.7z" | sha256sum -c -
          mkdir -p pk/cars && 7z x -y -opk/cars cars.7z > /dev/null
          test -f pk/cars/modloader/godjo_cars/turismo.dff
          (cd pk/cars && zip -qr -9 ../../dist/godjo-cars.zip .)
          # текстуры (экраны загрузки) генерируются скриптом
          pip install --quiet pillow
          python3 tools/ci/make-textures.py dist/godjo-textures.zip
          # экран загрузки Godjo вместо заставки SA-MP (ASI-плагин samp-custom-loading-screen + наша анимация)
          curl -fsSL -o cls.zip https://github.com/vendder5/samp-custom-loading-screen/releases/download/build/custom-loading-screen.zip
          mkdir -p pk/cls && unzip -o -q cls.zip -d pk/cls
          ASI=$(find pk/cls -iname 'custom-loading-screen.asi' | head -1); test -n "$ASI"
          python3 tools/ci/make-loadscreen.py "$ASI" dist/godjo-loadscreen.zip

      - name: Plugins (HUD, windowed mode)
        run: |
          sudo apt-get install -y -qq gcc-mingw-w64-i686 > /dev/null
          mkdir -p pk/hud pk/wnd
          i686-w64-mingw32-gcc -O2 -s -shared -static-libgcc -o pk/hud/godjo-hud.asi tools/asi/godjo_hud.c
          file pk/hud/godjo-hud.asi | grep -q "PE32 executable (DLL)"
          curl -fsSL -o wnd.zip https://github.com/ThirteenAG/III.VC.SA.WindowedMode/releases/download/v2.2/III.VC.SA.WindowedMode.zip
          unzip -o -q wnd.zip -d pk/wnd_src
          cp "$(find pk/wnd_src -iname 'III.VC.SA.WindowedMode.asi' | head -1)" pk/wnd/
          python3 - <<'PY'
          import zipfile
          def mk(out, files):
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  for name, data in files:
                      zi = zipfile.ZipInfo(name, (2025, 1, 1, 0, 0, 0)); zi.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(zi, data)
          mk("dist/godjo-hud.zip", [("godjo-hud.asi", open("pk/hud/godjo-hud.asi", "rb").read()),
                                    ("godjo.ini", b"[hud]\r\n; 1 - \xf1\xea\xf0\xfb\xf2\xfc \xf1\xf2\xe0\xed\xe4\xe0\xf0\xf2\xed\xfb\xe9 HUD GTA (\xf0\xe0\xe4\xe0\xf0 \xee\xf1\xf2\xe0\xb8\xf2\xf1\xff), 0 - \xef\xee\xea\xe0\xe7\xfb\xe2\xe0\xf2\xfc\r\nhide=1\r\n")])
          ini = "[window]\r\nmode=2\r\nwindowedStyle=2\r\npositionX=-1\r\npositionY=-1\r\n[game]\r\nautoPause=0\r\nautoResume=1\r\n"
          mk("dist/godjo-windowed.zip", [("III.VC.SA.WindowedMode.asi", open("pk/wnd/III.VC.SA.WindowedMode.asi", "rb").read()),
                                         ("III.VC.SA.WindowedMode.ini", ini.encode())])
          PY

      - name: Manifest + launcher bundle
        env:
          GODJO_SERVER_IP: ${{ github.event.inputs.server_ip || vars.GODJO_SERVER_IP || '127.0.0.1' }}
          GODJO_SERVER_PORT: ${{ vars.GODJO_SERVER_PORT || '7777' }}
          GODJO_DISCORD: ${{ vars.GODJO_DISCORD || '' }}
          GODJO_VK: ${{ vars.GODJO_VK || '' }}
          GODJO_TELEGRAM: ${{ vars.GODJO_TELEGRAM || '' }}
          GODJO_GAME_MANIFEST: ${{ vars.GODJO_GAME_MANIFEST || 'https://1drv.ms/u/c/017D0E6D4459724D/IQAt3KyOsM0EQLrIxvnFHfKPAddcsrku5WnuzVDdgLcvaXA?e=q32RBy|https://1drv.ms/u/c/017D0E6D4459724D/IQAYzaPLHtsuS7Xv-knpBOFIAbV3FaoCPhX7jQGWqUQ1MJU?e=BkLMRv' }}
        run: |
          VER="2.0.${{ github.run_number }}"
          python3 tools/ci/make-manifest.py dist "$VER"
          L=dist/GodjoRP-Launcher
          mkdir -p $L/client
          cp art/launcher/GodjoLauncher.exe $L/
          cp dist/manifest.json dist/cef-client.zip dist/godjo-ui.zip dist/asi-loader.zip dist/modloader.zip dist/godjo-cars.zip dist/godjo-textures.zip dist/godjo-loadscreen.zip dist/godjo-hud.zip dist/godjo-windowed.zip $L/client/
          python3 - <<PY
          import json, os
          s = {"manifestUrl": "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json",
               "serverName": "Godjo Role Play", "serverIp": os.environ["GODJO_SERVER_IP"], "serverPort": int(os.environ["GODJO_SERVER_PORT"]),
               "site": "https://github.com/${{ github.repository }}",
               "discord": os.environ.get("GODJO_DISCORD", ""), "vk": os.environ.get("GODJO_VK", ""), "telegram": os.environ.get("GODJO_TELEGRAM", ""), "gameManifestUrl": os.environ.get("GODJO_GAME_MANIFEST", "")}
          json.dump(s, open("$L/launcher.json", "w"), indent=2)
          PY
          cp docs/PLAYER.md $L/README.md
          sed "s/\r*$/\r/" tools/make-game-pack.bat > $L/make-game-pack.bat
          (cd dist && zip -qr GodjoRP-Launcher.zip GodjoRP-Launcher)
          cp art/launcher/GodjoLauncher.exe dist/
          echo "VER=$VER" >> $GITHUB_ENV

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer GodjoSetup.exe
        run: |
          tr -d "\r\n" < launcher/app.ico.b64 | base64 -d > launcher/app.ico
          (cd dist/GodjoRP-Launcher && zip -q -9 ../../payload.zip GodjoLauncher.exe launcher.json)
          dotnet build installer/GodjoSetup.csproj -c Release -p:Payload=$GITHUB_WORKSPACE/payload.zip -p:Version=$VER -o out-setup
          cp out-setup/GodjoSetup.exe dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.zip
            dist/manifest.json
            dist/GodjoLauncher.exe
            dist/GodjoSetup.exe

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Godjo Role Play ${{ env.VER }}
          make_latest: true
          body: |
            Автоматическая сборка из `${{ github.sha }}`.
            * **GodjoSetup.exe** — установщик лаунчера (рекомендуется): ярлыки, удаление через «Программы», WebView2.
            * **GodjoRP-Server.zip** — готовый сервер для Windows (распаковать и запустить `start.bat`).
            * **GodjoRP-Launcher.zip** — лаунчер для игроков (с файлами клиента внутри, работает и без интернета).
            * **GodjoLauncher.exe** — только лаунчер (файлы скачает сам).
          files: |
            dist/GodjoRP-Server.zip
            dist/GodjoRP-Launcher.zip
            dist/GodjoLauncher.exe
            dist/GodjoSetup.exe
            dist/manifest.json
            dist/modloader.zip
            dist/godjo-cars.zip
            dist/godjo-textures.zip
            dist/godjo-loadscreen.zip
            dist/godjo-hud.zip
            dist/godjo-windowed.zip
            dist/cef-client.zip
            dist/godjo-ui.zip
            dist/asi-loader.zip
